:root{--y:#ffcc00;--y2:#fff36b;--bg:#101010;--card:#242424;--muted:#999}
*{box-sizing:border-box} body{margin:0;background:linear-gradient(135deg,#0d0d0d,#191919 60%,#302900);color:#fff;font-family:'Comfortaa',Arial,Helvetica,sans-serif;min-height:100vh}
button{font:inherit}.wrap{max-width:900px;margin:auto;padding:140px 16px 50px}
.site-logo{position:fixed;top:18px;left:20px;width:100px;height:auto;z-index:100;pointer-events:none}
@media(max-width:600px){.site-logo{top:12px;left:12px;width:72px}.wrap{padding-top:105px}}
.brand{margin-bottom:10px}.brand img{display:block;width:min(310px,78vw);height:auto}.logo{font-weight:900;font-size:36px;margin:0}.yellow{color:var(--y)}.sub{color:#aaa;margin:6px 0 26px}
.seasons{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.season{background:linear-gradient(145deg,#292929,#181818);border:2px solid #444;border-radius:16px;padding:20px;text-align:left;color:#fff;cursor:pointer;transition:.15s}
.season:hover{transform:translateY(-3px);border-color:var(--y)}.season .year{font-size:34px;font-weight:900;color:var(--y)}
.season .place{color:#aaa;margin-top:5px}.season .count{margin-top:15px;font-size:13px;color:#777}
.hidden{display:none}.topbar{display:flex;align-items:center;gap:12px;margin-bottom:18px}.topbar .sub{margin:3px 0 0}
.back{background:#222;color:#fff;border:1px solid #555;border-radius:9px;padding:9px 13px;cursor:pointer}.back:hover{border-color:var(--y)}
h1{font-size:32px;margin:0}.tools{display:flex;flex-wrap:wrap;gap:9px;margin:14px 0}
.action{border:3px solid #ffaa00;border-radius:9px;background:radial-gradient(circle,#fff36b,#ffcc00);color:#111;font-weight:900;padding:10px 14px;cursor:pointer}
.hint{font-size:13px;color:#888;margin:0 0 13px}.list{display:flex;flex-direction:column;gap:7px}
.song{display:grid;grid-template-columns:50px 1fr 78px 32px;gap:10px;align-items:center;background:var(--card);border:1px solid #444;border-radius:10px;padding:8px 10px;cursor:grab}
.song.dragging{opacity:.4;border-color:var(--y)}.rank{text-align:center;font-weight:900;font-size:20px;color:var(--y)}
.name{font-weight:900}.artist{font-size:13px;color:#aaa;margin-top:2px}.score{width:68px;background:#111;color:#fff;border:1px solid #666;border-radius:7px;padding:7px;text-align:center;font-weight:900}
.grip{text-align:center;color:#777;font-size:20px}.arrows{display:none;gap:3px}.mini{background:#333;color:#fff;border:1px solid #555;border-radius:5px;width:25px;height:25px;cursor:pointer}
.footer{text-align:center;color:#666;font-size:12px;margin-top:18px}

// Загружает исторические сезоны 2000–2022 из публичного датасета TidyTuesday.
// Важно: функция определена до первого вызова, чтобы не блокировать initHome().
async function loadHistoricalSeasons(){
  const url="https://raw.githubusercontent.com/rfordatascience/tidytuesday/main/data/2022/2022-05-17/eurovision.csv";
  const countryCodes={
    "Albania":"AL","Andorra":"AD","Armenia":"AM","Australia":"AU","Austria":"AT","Azerbaijan":"AZ",
    "Belarus":"BY","Belgium":"BE","Bosnia and Herzegovina":"BA","Bosnia & Herzegovina":"BA","Bulgaria":"BG","Croatia":"HR",
    "Cyprus":"CY","Czech Republic":"CZ","Czechia":"CZ","Denmark":"DK","Estonia":"EE","Finland":"FI",
    "France":"FR","Georgia":"GE","Germany":"DE","Greece":"GR","Hungary":"HU","Iceland":"IS",
    "Ireland":"IE","Israel":"IL","Italy":"IT","Latvia":"LV","Lithuania":"LT","Luxembourg":"LU",
    "Malta":"MT","Moldova":"MD","Monaco":"MC","Montenegro":"ME","Morocco":"MA","Netherlands":"NL",
    "North Macedonia":"MK","Macedonia":"MK","Norway":"NO","Poland":"PL","Portugal":"PT","Romania":"RO",
    "Russia":"RU","Russian Federation":"RU","San Marino":"SM","Serbia":"RS","Serbia and Montenegro":"RS","Serbia & Montenegro":"RS",
    "Slovakia":"SK","Slovenia":"SI","Spain":"ES","Sweden":"SE","Switzerland":"CH","Turkey":"TR",
    "Türkiye":"TR","Ukraine":"UA","United Kingdom":"GB","Yugoslavia":"RS"
  };

  const emojiToCode={...FLAG_CODE};
  const clean=v=>String(v??"").trim();
  const parseCSV=text=>{
    const rows=[]; let row=[], cell="", quoted=false;
    for(let i=0;i<text.length;i++){
      const ch=text[i];
      if(quoted){
        if(ch==='"'){
          if(text[i+1]==='"'){cell+='"';i++;}
          else quoted=false;
        }else cell+=ch;
      }else{
        if(ch==='"') quoted=true;
        else if(ch===','){row.push(cell);cell="";}
        else if(ch==='\n'){row.push(cell);rows.push(row);row=[];cell="";}
        else if(ch!=='\r') cell+=ch;
      }
    }
    if(cell!=="" || row.length){row.push(cell);rows.push(row);}
    if(!rows.length)return [];
    const headers=rows.shift().map(clean);
    return rows.map(r=>Object.fromEntries(headers.map((h,i)=>[h,clean(r[i])])));
  };

  try{
    let csvText=null;
    try{
      const res=await fetch(url,{cache:"no-store"});
      if(!res.ok)throw new Error("HTTP "+res.status);
      csvText=await res.text();
    }catch(rawErr){
      // Some browsers block direct fetches from local file:// pages.
      // Fall back to GitHub's CORS-enabled Contents API.
      const api="https://api.github.com/repos/rfordatascience/tidytuesday/contents/data/2022/2022-05-17/eurovision.csv?ref=main";
      const res=await fetch(api,{cache:"no-store",headers:{"Accept":"application/vnd.github+json"}});
      if(!res.ok)throw rawErr;
      const json=await res.json();
      if(!json.content)throw rawErr;
      const bin=atob(String(json.content).replace(/\s/g,""));
      let bytes="";
      for(let i=0;i<bin.length;i+=8192)bytes+=String.fromCharCode(...bin.slice(i,i+8192).split("").map(ch=>ch.charCodeAt(0)));
      csvText=new TextDecoder("utf-8").decode(Uint8Array.from(bytes,ch=>ch.charCodeAt(0)));
    }
    const rows=parseCSV(csvText);
    const historical={};

    rows.forEach(r=>{
      const year=Number(r.year);
      if(year<2000 || year>2022)return;
      const section=clean(r.section).toLowerCase();
      // 2000–2003 had only the final. From 2004 onward the Eurovision
      // format included semi-finals, so the season list must contain the
      // union of all semi-finalists and grand-finalists.
      if(year<=2003){
        if(section!=="final" && section!=="grand-final")return;
      }else{
        if(!["first-semi-final","second-semi-final","semi-final","final","grand-final"].includes(section))return;
      }

      const country=clean(r.artist_country);
      if(!country)return;
      // Serbia & Montenegro existed as a participating entry only in 2004–2005.
      // The 2006 dataset can contain a stale/administrative reference to it;
      // it must not appear as a 2006 participant.
      if(year===2006 && /^(Serbia\s*(?:and|&)\s*Montenegro)$/i.test(country))return;
      const emojiCode=clean(r.country_emoji).replace(/^:flag_/,'').replace(/:$/,'').toUpperCase();
      const emojiAliases={
        AL:"AL",AD:"AD",AM:"AM",AU:"AU",AT:"AT",AZ:"AZ",BY:"BY",BE:"BE",BA:"BA",BG:"BG",
        HR:"HR",CY:"CY",CZ:"CZ",DK:"DK",EE:"EE",FI:"FI",FR:"FR",GE:"GE",DE:"DE",GR:"GR",HU:"HU",
        IS:"IS",IE:"IE",IL:"IL",IT:"IT",LV:"LV",LT:"LT",LU:"LU",MT:"MT",MD:"MD",MC:"MC",ME:"ME",
        MA:"MA",NL:"NL",MK:"MK",NO:"NO",PL:"PL",PT:"PT",RO:"RO",RU:"RU",SM:"SM",RS:"RS",SK:"SK",
        SI:"SI",ES:"ES",SE:"SE",CH:"CH",TR:"TR",UA:"UA",GB:"GB"
      };
      const code=emojiAliases[emojiCode] || countryCodes[country];
      if(!code)return;

      if(!historical[year])historical[year]={place:clean(r.host_city)||"",songs:[]};
      historical[year].place=clean(r.host_city)||historical[year].place;
      historical[year].songs.push([
        code,
        country==="Czech Republic"?"Czechia":country,
        clean(r.artist),
        clean(r.song)
      ]);
    });

    Object.keys(historical).forEach(y=>{
      // Merge semi-finals + grand final into one season list. A country can
      // occur in both, so keep only its first occurrence. Then sort by country
      // name for a stable, neutral starting order.
      const seen=new Set();
      historical[y].songs=historical[y].songs.filter(s=>{
        if(seen.has(s[1]))return false;
        seen.add(s[1]);return true;
      }).sort((a,b)=>a[1].localeCompare(b[1],"en"));
      if(historical[y].songs.length)SEASONS[y]=historical[y];
    });
  }catch(err){
    console.warn("EuroRanks: historical seasons could not be loaded.",err);
  }
}

let season=null,data=[],dragId=null,dragEl=null;
const $=id=>document.getElementById(id);

function siteBase(){
  const path=location.pathname;
  const m=path.match(/^(.*\/)\d{4}\/?$/);
  if(m)return m[1];
  return path.endsWith("/")?path:path+"/";
}
function seasonURL(y){return siteBase()+String(y)+"/";}
function currentSeasonFromURL(){
  const m=location.pathname.match(/(?:^|\/)((?:20)\d{2})\/?$/);
  const y=m?m[1]:null;
  return y && SEASONS[y] ? y : null;
}
function initHome(push=false){
  $("seasons").innerHTML="";
  Object.keys(SEASONS).sort((a,b)=>b-a).forEach(y=>{
    const b=document.createElement("button"); b.className="season";
    b.innerHTML=`<div class="year">${y}</div><div class="place"><span class="flag-wrap">${svgFlag(HOST_FLAGS[y])}<span>${SEASONS[y].place}</span></span></div><div class="count">${SEASONS[y].songs.length} участников</div>`;
    b.onclick=()=>openSeason(y); $("seasons").appendChild(b);
  });
  $("board").classList.add("hidden");$("home").classList.remove("hidden");
  if(push) history.pushState({page:"home"},"",siteBase());
}
function openSeason(y,push=true){
  y=String(y); if(!SEASONS[y])return;
  season=y; const key="meScore_"+season;
  const base=SEASONS[y].songs.map((s,i)=>({id:i,flag:flagCode(s[0]),country:s[1],artist:s[2],song:s[3],score:0}));
  data=JSON.parse(localStorage.getItem(key))||base;
  $("home").classList.add("hidden");$("board").classList.remove("hidden");
  $("title").textContent="Eurovision "+season;
  $("venue").innerHTML=`<span class="flag-wrap">${svgFlag(HOST_FLAGS[y])}<span>${SEASONS[y].place}</span></span>`;
  $("footerYear").textContent=season;render();
  if(push) history.pushState({page:"season",season:y},"",seasonURL(y));
}
function goHome(push=true){
  if(push){history.pushState({page:"home"},"",siteBase());}
  $("board").classList.add("hidden");$("home").classList.remove("hidden");
}
window.addEventListener("popstate",()=>{
  const y=currentSeasonFromURL();
  if(y) openSeason(y,false); else initHome(false);
});
document.addEventListener("keydown",e=>{
  if(!e.altKey)return;
  if(e.key==="Home"){e.preventDefault();goHome(true);}
  if(e.key==="End" && season){e.preventDefault();openSeason(season,true);}
});
function save(){localStorage.setItem("meScore_"+season,JSON.stringify(data))}
function render(){
  $("list").innerHTML="";
  data.forEach((s,i)=>{
    const el=document.createElement("div");el.className="song";el.draggable=true;el.dataset.id=s.id;
    el.innerHTML=`<div class="rank">${i+1}</div><div><div class="name"><span class="flag-wrap">${svgFlag(s.flag)}<span>${s.country}</span></span></div><div class="artist">${s.artist} — ${s.song}</div></div>
    <input class="score" type="number" min="0" max="100" value="${s.score}" aria-label="Баллы">
    <div class="grip">☰</div><div class="arrows"><button class="mini" onclick="move(${s.id},-1)">▲</button><button class="mini" onclick="move(${s.id},1)">▼</button></div>`;
    el.addEventListener("dragstart",e=>{
      dragId=s.id; dragEl=el; el.classList.add("dragging");
      e.dataTransfer.effectAllowed="move";
    });
    el.addEventListener("dragend",()=>{
      if(dragEl) dragEl.classList.remove("dragging");
      dragId=null; dragEl=null; syncDataFromDOM(); save(); render();
    });
    el.addEventListener("dragover",e=>{
      e.preventDefault();
      if(!dragEl || el===dragEl)return;
      const rect=el.getBoundingClientRect();
      const after=e.clientY > rect.top + rect.height/2;
      if(after){
        if(el.nextSibling!==dragEl) $("list").insertBefore(dragEl,el.nextSibling);
      }else{
        if(el.previousSibling!==dragEl) $("list").insertBefore(dragEl,el);
      }
    });
    el.addEventListener("drop",e=>{e.preventDefault()});
    el.querySelector(".score").addEventListener("input",e=>{s.score=Math.max(0,Math.min(100,Number(e.target.value)||0));save()});
    $("list").appendChild(el);
  });
}
function syncDataFromDOM(){
  const order=[...$("list").children].map(el=>Number(el.dataset.id));
  if(order.length!==data.length)return;
  const byId=new Map(data.map(x=>[x.id,x]));
  data=order.map(id=>byId.get(id)).filter(Boolean);
}
function move(id,dir){
  const i=data.findIndex(x=>x.id===id),j=i+dir;if(j<0||j>=data.length)return;
  [data[i],data[j]]=[data[j],data[i]];save();render();
}
function sortByScore(){data.sort((a,b)=>b.score-a.score);save();render()}
function resetSeason(){
  if(!confirm("Сбросить порядок и все баллы этого сезона?"))return;
  data=SEASONS[season].songs.map((s,i)=>({id:i,flag:flagCode(s[0]),country:s[1],artist:s[2],song:s[3],score:0}));
  save();render();
}
async function savePNG(){
  // 15 countries per column; raster scale reduced by ~1.5× from the previous version.
  const perCol=15;
  const cols=Math.ceil(data.length/perCol);
  const scale=1.33, colW=320, gap=18, pad=35;
  const w=pad*2+cols*colW+(cols-1)*gap;
  const rowH=58, top=145, rows=Math.min(perCol,data.length);
  const h=top+rowH*rows+55;
  const c=document.createElement("canvas");c.width=Math.round(w*scale);c.height=Math.round(h*scale);
  const ctx=c.getContext("2d");ctx.scale(scale,scale);

  const g=ctx.createLinearGradient(0,0,w,h);
  g.addColorStop(0,"#101010");g.addColorStop(1,"#332b00");
  ctx.fillStyle=g;ctx.fillRect(0,0,w,h);

  // Header
  ctx.fillStyle="#ffcc00";ctx.font="900 42px Comfortaa, Arial";
  ctx.fillText("EuroRanks",50,58);
  ctx.fillStyle="#ddd";ctx.font="700 21px Comfortaa, Arial";
  ctx.fillText("Eurovision "+season+" • "+SEASONS[season].place,50,96);

  // Eurovision-style points: 12, 10, 8…1 for the top ten; no points below 10th.
  const EURO_POINTS=[12,10,8,7,6,5,4,3,2,1];

  // Preload flag SVGs so they are included in the PNG.
  const imgs={};
  await Promise.all([...new Set(data.map(s=>s.flag))].map(code=>new Promise(resolve=>{
    const img=new Image();
    img.onload=()=>{imgs[code]=img;resolve()};
    img.onerror=()=>resolve();
    img.src=flagImg(code);
  })));

  data.forEach((s,i)=>{
    const col=Math.floor(i/perCol), row=i%perCol;
    const x=pad+col*(colW+gap), y=top+row*rowH;
    ctx.fillStyle="#242424";round(ctx,x,y,colW,rowH-7,10);ctx.fill();

    ctx.fillStyle="#ffcc00";ctx.font="900 21px Comfortaa, Arial";
    ctx.textAlign="center";ctx.fillText(i+1,x+30,y+32);

    if(imgs[s.flag]) ctx.drawImage(imgs[s.flag],x+50,y+11,28,20);

    ctx.textAlign="left";ctx.fillStyle="#fff";ctx.font="700 15px Comfortaa, Arial";
    ctx.fillText(s.country,x+84,y+23);
    ctx.fillStyle="#aaa";ctx.font="400 11px Comfortaa, Arial";
    const artist=(s.artist+" — "+s.song);
    ctx.fillText(artist.length>34?artist.slice(0,32)+"…":artist,x+84,y+41);

    const pts=EURO_POINTS[i] || null;
    ctx.fillStyle=pts ? "#ffcc00" : "#777";
    ctx.font="900 17px Comfortaa, Arial";
    ctx.textAlign="right";
    if(pts) ctx.fillText(pts+" pts",x+colW-13,y+31);
    ctx.textAlign="left";
  });

  ctx.fillStyle="#777";ctx.font="400 12px Comfortaa, Arial";
  ctx.fillText("EuroRanks • your Eurovision ranking",50,h-18);

  const a=document.createElement("a");
  a.download=`EuroRanks_${season}.png`;
  a.href=c.toDataURL("image/png");a.click();
}
function round(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
loadHistoricalSeasons().finally(()=>{
  initHome(false);
  const y=currentSeasonFromURL();
  if(y) openSeason(y,false);
  else if(location.pathname!==siteBase()) history.replaceState({page:"home"},"",siteBase());
});
</script>
